<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rustle</title>
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <div class="brand">
          <h1>Rustle</h1>
          <span id="app-version" class="app-version"></span>
        </div>
        <span id="status-pill" class="status-pill status-idle">Idle</span>
      </header>

      <nav class="tabs">
        <button class="tab is-active" data-tab="dictation" type="button">Dictation</button>
        <button class="tab" data-tab="history" type="button">History</button>
      </nav>

      <div class="body">
        <section class="tab-panel is-active" id="panel-dictation">
          <div class="field">
            <span class="field-label">Live transcript</span>
            <textarea
              id="live-transcript"
              class="transcript"
              readonly
              rows="3"
              placeholder="Words go into the app you are using, not this box."
            ></textarea>
          </div>

          <div class="field">
            <label class="field-label" for="dictation-toggle">Dictation</label>
            <label class="switch">
              <input type="checkbox" id="dictation-toggle" checked />
              <span class="switch-track"></span>
              <span class="switch-caption" id="dictation-caption">Listening for the hotkey</span>
            </label>
          </div>

          <div class="field">
            <label class="field-label" for="hotkey-select">Push-to-talk key</label>
            <select id="hotkey-select">
              <option value="RightControl">Right Control</option>
              <option value="RightOption">Right Alt</option>
              <option value="F8">F8</option>
              <option value="F9">F9</option>
            </select>
            <p class="field-hint">Hold to talk, release to type into the focused app.</p>
          </div>

          <div class="field">
            <label class="field-label" for="microphone-select">Microphone</label>
            <select id="microphone-select">
              <option value="">System default</option>
            </select>
          </div>

          <div class="field">
            <label class="field-label" for="model-select">Model</label>
            <div class="inline-row">
              <select id="model-select">
                <option value="ggml-base.en.bin">base.en</option>
                <option value="ggml-small.en.bin">small.en</option>
                <option value="ggml-medium.en.bin">medium.en</option>
                <option value="ggml-large-v3.bin">large-v3</option>
              </select>
              <button id="model-download" class="secondary" type="button" hidden>Download</button>
            </div>
            <p class="field-hint" id="download-status"></p>
          </div>

          <div class="field">
            <span class="field-label">Word corrections</span>
            <p class="field-hint">Fix words Whisper mishears: heard on the left, written on the right.</p>
            <input
              id="corrections-search"
              type="search"
              placeholder="Search corrections"
              autocomplete="off"
            />
            <div id="corrections-list" class="corrections-list"></div>
            <div class="inline-row corrections-actions">
              <button id="add-correction" class="secondary" type="button">Add correction</button>
              <button id="export-corrections" class="secondary" type="button">Export</button>
              <button id="import-corrections" class="secondary" type="button">Import</button>
            </div>
            <p class="field-hint" id="corrections-file-note"></p>
          </div>

          <div class="field">
            <label class="field-label" for="enter-toggle">After dictation</label>
            <label class="switch">
              <input type="checkbox" id="enter-toggle" />
              <span class="switch-track"></span>
              <span class="switch-caption" id="enter-caption">Press Return when you release the key</span>
            </label>
          </div>

          <div class="field">
            <label class="field-label" for="launch-toggle">Startup</label>
            <label class="switch">
              <input type="checkbox" id="launch-toggle" />
              <span class="switch-track"></span>
              <span class="switch-caption">Launch Rustle at login</span>
            </label>
          </div>

          <div id="insert-banner" class="insert-banner" hidden>
            <p id="insert-note" class="insert-note-text"></p>
            <button id="open-accessibility" class="secondary" type="button">
              Open Accessibility settings
            </button>
          </div>

          <div id="update-banner" class="update-banner" hidden>
            <p id="update-note" class="update-note-text"></p>
            <button id="install-update" class="secondary" type="button">Install update</button>
          </div>

          <div class="actions">
            <span id="save-note" class="save-note"></span>
            <button id="save-button" class="primary" type="button">Save settings</button>
          </div>
        </section>

        <section class="tab-panel" id="panel-history">
          <div class="block-head">
            <span class="field-label">Dictation history</span>
            <div class="inline-row">
              <button id="export-history" class="link-button" type="button">Export</button>
              <button id="import-history" class="link-button" type="button">Import</button>
              <button id="clear-history" class="link-button" type="button">Clear</button>
            </div>
          </div>
          <p class="field-hint">Double-click a word to set a replacement.</p>
          <p class="field-hint" id="history-file-note"></p>
          <div id="history-list" class="history"></div>
        </section>
      </div>
    </main>

    <div id="word-replace" class="word-replace" hidden>
      <div class="word-replace-card">
        <p class="word-replace-label">
          Replace <span id="word-replace-from" class="word-replace-from"></span> with
        </p>
        <input id="word-replace-to" type="text" autocomplete="off" />
        <div class="word-replace-actions">
          <button id="word-replace-cancel" class="secondary" type="button">Cancel</button>
          <button id="word-replace-save" class="primary" type="button">Save</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
