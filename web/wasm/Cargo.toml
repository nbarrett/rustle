[package]
name = "rustle-web-core"
version = "0.1.10"
edition = "2021"
license = "MIT"
description = "Browser bindings for the Rustle correction engine, so the web target and the desktop app share one implementation."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustle-core = { path = "../../core", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
