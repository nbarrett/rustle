name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release and upload Mac, Windows, and Linux apps
        type: boolean
        default: false
      tag:
        description: Must match package.json. Leave empty to use package.json.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libx11-dev libxtst-dev libxi-dev libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS tools
        run: pnpm install --frozen-lockfile

      - name: Typecheck UI
        run: pnpm typecheck

      - name: Run unit tests
        run: cargo test -p rustle-core --lib

  build-and-release:
    needs: test
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pack: macos-aarch64
          - os: windows-latest
            pack: windows-x64
          - os: ubuntu-latest
            pack: linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Align release with package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          REQUESTED_TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [[ -z "${REQUESTED_TAG}" ]]; then
            REQUESTED_TAG="${EXPECTED_TAG}"
          fi
          if [[ "${REQUESTED_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "GitHub tag '${REQUESTED_TAG}' does not match package.json version '${PACKAGE_VERSION}'."
            echo "Bump package.json (and tauri.conf.json) to match, or tag ${EXPECTED_TAG}."
            exit 1
          fi
          python3 - <<PY
          import json
          from pathlib import Path
          version = "${PACKAGE_VERSION}"
          tauri = Path("src-tauri/tauri.conf.json")
          data = json.loads(tauri.read_text())
          data["version"] = version
          tauri.write_text(json.dumps(data, indent=2) + "\n")
          for cargo in [Path("src-tauri/Cargo.toml"), Path("core/Cargo.toml")]:
              text = cargo.read_text()
              lines = text.splitlines(keepends=True)
              out = []
              seen_package = False
              replaced = False
              for line in lines:
                  if line.startswith("[package]"):
                      seen_package = True
                  if seen_package and line.startswith("version = ") and not replaced:
                      out.append(f'version = "{version}"\n')
                      replaced = True
                      continue
                  out.append(line)
              cargo.write_text("".join(out))
          PY
          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "Using package.json version ${PACKAGE_VERSION} (${EXPECTED_TAG})"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cmake (macOS)
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libx11-dev libxtst-dev libxi-dev libclang-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS tools
        run: pnpm install --frozen-lockfile

      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "Set the TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi

      - name: Write updater bundle config
        shell: bash
        run: |
          if [[ "${{ matrix.pack }}" == "macos-aarch64" ]]; then
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}' > updater-bundle.json
          else
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":true}}' > updater-bundle.json
          fi

      - name: Build Mac app
        if: matrix.pack == 'macos-aarch64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app,dmg --config updater-bundle.json

      - name: Build Windows app
        if: matrix.pack == 'windows-x64'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis --config updater-bundle.json

      - name: Build Linux apps
        if: matrix.pack == 'linux-x64'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage,deb --config updater-bundle.json

      - name: Name release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          write_updater_part() {
            python3 - "$1" "$2" "$3" "$PACKAGE_VERSION" "$RELEASE_TAG" "$GITHUB_REPOSITORY" <<'PY'
          import json, pathlib, sys
          platform, asset_name, sig_path, version, tag, repo = sys.argv[1:7]
          signature = pathlib.Path(sig_path).read_text().strip()
          part = {
              "version": version,
              "platform": platform,
              "url": f"https://github.com/{repo}/releases/download/{tag}/{asset_name}",
              "signature": signature,
          }
          pathlib.Path("updater-part.json").write_text(json.dumps(part) + "\n")
          PY
          }
          case "${{ matrix.pack }}" in
            macos-aarch64)
              dmg="$(find target -name '*.dmg' | head -n 1)"
              tarball="$(find target -name '*.app.tar.gz' | head -n 1)"
              sig="$(find target -name '*.app.tar.gz.sig' | head -n 1)"
              if [[ -z "${dmg}" || -z "${tarball}" || -z "${sig}" ]]; then
                echo "Missing Mac updater files"
                find target -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig'
                exit 1
              fi
              cp "${dmg}" release-assets/Rustle-macos-aarch64.dmg
              cp "${tarball}" release-assets/Rustle-macos-aarch64.app.tar.gz
              cp "${sig}" release-assets/Rustle-macos-aarch64.app.tar.gz.sig
              write_updater_part darwin-aarch64 Rustle-macos-aarch64.app.tar.gz "${sig}"
              ;;
            windows-x64)
              installer="$(find target -name '*setup.exe' | head -n 1)"
              sig="$(find target -name '*setup.exe.sig' | head -n 1)"
              cp "${installer}" release-assets/Rustle-windows-x64-setup.exe
              cp "${sig}" release-assets/Rustle-windows-x64-setup.exe.sig
              write_updater_part windows-x86_64 Rustle-windows-x64-setup.exe "${sig}"
              ;;
            linux-x64)
              appimage="$(find target -name '*.AppImage' | head -n 1)"
              sig="$(find target -name '*.AppImage.sig' | head -n 1)"
              deb="$(find target -name '*.deb' | head -n 1)"
              cp "${appimage}" release-assets/Rustle-linux-x64.AppImage
              chmod +x release-assets/Rustle-linux-x64.AppImage
              cp "${sig}" release-assets/Rustle-linux-x64.AppImage.sig
              cp "${deb}" release-assets/Rustle-linux-x64.deb
              write_updater_part linux-x86_64 Rustle-linux-x64.AppImage "${sig}"
              ;;
          esac
          ls -la release-assets
          cat updater-part.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustle-${{ env.RELEASE_TAG }}-${{ matrix.pack }}
          path: release-assets/*

      - name: Upload updater fragment
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.pack }}
          path: updater-part.json

      - name: Attach files to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          attempt=1
          while true; do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" release-assets/* --clobber
              echo "Release ${RELEASE_TAG} already exists; uploaded ${{ matrix.pack }}"
              exit 0
            fi
            create_ok=1
            if [[ "${REF_TYPE}" == "tag" ]]; then
              gh release create "${RELEASE_TAG}" \
                --title "Rustle ${RELEASE_TAG}" \
                --generate-notes \
                release-assets/* || create_ok=0
            else
              gh release create "${RELEASE_TAG}" \
                --title "Rustle ${RELEASE_TAG}" \
                --generate-notes \
                --target "${REF_NAME}" \
                release-assets/* || create_ok=0
            fi
            if [[ "${create_ok}" == "1" ]]; then
              exit 0
            fi
            if [[ "${attempt}" -ge 5 ]]; then
              echo "Could not create release after ${attempt} attempts"
              exit 1
            fi
            echo "Release create failed; retrying in 15s (attempt ${attempt})"
            attempt=$((attempt + 1))
            sleep 15
          done

  updater-manifest:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download updater fragments
        uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-parts

      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          parts = []
          for path in glob.glob("updater-parts/**/updater-part.json", recursive=True):
              parts.append(json.loads(Path(path).read_text()))
          if not parts:
              raise SystemExit("no updater fragments")
          platforms = {}
          version = parts[0]["version"]
          for part in parts:
              platforms[part["platform"]] = {
                  "signature": part["signature"],
                  "url": part["url"],
              }
          needed = {"darwin-aarch64", "windows-x86_64", "linux-x86_64"}
          missing = needed - set(platforms)
          if missing:
              raise SystemExit(f"missing updater platforms: {sorted(missing)}")
          manifest = {
              "version": version,
              "notes": "Rustle update",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          Path("latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
          RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("latest.json"))["version"])')"
          gh release upload "${RELEASE_TAG}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Upload download page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy download page
        id: deploy
        uses: actions/deploy-pages@v4
