name: Test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Create a GitHub release and upload the Mac app
        type: boolean
        default: false
      tag:
        description: Must match package.json as v0.1.1. Leave empty to use package.json.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cmake if missing
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS tools
        run: pnpm install --frozen-lockfile

      - name: Typecheck UI
        run: pnpm typecheck

      - name: Run unit tests
        run: cargo test -p rustle-core --lib --no-default-features

  build-and-release:
    needs: test
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Align release with package.json
        id: version
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          REQUESTED_TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if [[ -z "${REQUESTED_TAG}" ]]; then
            REQUESTED_TAG="${EXPECTED_TAG}"
          fi
          if [[ "${REQUESTED_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "GitHub tag '${REQUESTED_TAG}' does not match package.json version '${PACKAGE_VERSION}'."
            echo "Bump package.json (and tauri.conf.json) to match, or tag ${EXPECTED_TAG}."
            exit 1
          fi
          python3 - <<PY
          import json
          from pathlib import Path
          version = "${PACKAGE_VERSION}"
          tauri = Path("src-tauri/tauri.conf.json")
          data = json.loads(tauri.read_text())
          data["version"] = version
          tauri.write_text(json.dumps(data, indent=2) + "\n")
          for cargo in [Path("src-tauri/Cargo.toml"), Path("core/Cargo.toml")]:
              text = cargo.read_text()
              lines = text.splitlines(keepends=True)
              out = []
              seen_package = False
              replaced = False
              for line in lines:
                  if line.startswith("[package]"):
                      seen_package = True
                  if seen_package and line.startswith("version = ") and not replaced:
                      out.append(f'version = "{version}"\n')
                      replaced = True
                      continue
                  out.append(line)
              cargo.write_text("".join(out))
          PY
          echo "RELEASE_TAG=${EXPECTED_TAG}" >> "${GITHUB_ENV}"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_ENV}"
          echo "Using package.json version ${PACKAGE_VERSION} (${EXPECTED_TAG})"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cmake if missing
        run: command -v cmake >/dev/null || brew install cmake

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS tools
        run: pnpm install --frozen-lockfile

      - name: Build Mac app
        run: >
          pnpm tauri build --bundles app
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Zip the app
        run: |
          ditto -c -k --keepParent \
            target/release/bundle/macos/Rustle.app \
            "Rustle-${RELEASE_TAG}-macos-aarch64.app.zip"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rustle-${{ env.RELEASE_TAG }}-macos-aarch64
          path: Rustle-${{ env.RELEASE_TAG }}-macos-aarch64.app.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ZIP="Rustle-${RELEASE_TAG}-macos-aarch64.app.zip"
          attempt=1
          while true; do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              gh release upload "${RELEASE_TAG}" "${ZIP}" --clobber
              echo "Release ${RELEASE_TAG} already exists; uploaded ${ZIP}"
              exit 0
            fi
            create_ok=1
            if [[ "${REF_TYPE}" == "tag" ]]; then
              gh release create "${RELEASE_TAG}" \
                --title "Rustle ${RELEASE_TAG}" \
                --generate-notes \
                "${ZIP}" || create_ok=0
            else
              gh release create "${RELEASE_TAG}" \
                --title "Rustle ${RELEASE_TAG}" \
                --generate-notes \
                --target "${REF_NAME}" \
                "${ZIP}" || create_ok=0
            fi
            if [[ "${create_ok}" == "1" ]]; then
              exit 0
            fi
            if [[ "${attempt}" -ge 5 ]]; then
              echo "Could not create release after ${attempt} attempts"
              exit 1
            fi
            echo "Release create failed; retrying in 15s (attempt ${attempt})"
            attempt=$((attempt + 1))
            sleep 15
          done
