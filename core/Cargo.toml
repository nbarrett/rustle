[package]
name = "rustle-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable dictation core for Rustle: config, audio capture, Whisper transcription, hotkey listening and keystroke injection."

[lib]
name = "rustle_core"
path = "src/lib.rs"

[[bin]]
name = "rustle-cli"
path = "src/bin/rustle_cli.rs"

[dependencies]
anyhow = "1"
cpal = "0.15"
whisper-rs = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
arboard = "3"
