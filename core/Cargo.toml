[package]
name = "rustle-core"
version = "0.1.5"
edition = "2021"
license = "MIT"
description = "Reusable dictation core for Rustle: config, audio capture, Whisper transcription, hotkey listening and keystroke injection."

[lib]
name = "rustle_core"
path = "src/lib.rs"

[[bin]]
name = "rustle-cli"
path = "src/bin/rustle_cli.rs"
required-features = ["runtime"]

[[bin]]
name = "rustle-probe"
path = "src/bin/rustle_probe.rs"
required-features = ["runtime"]

[features]
default = ["runtime"]
runtime = ["dep:whisper-rs", "dep:cpal", "dep:arboard"]

[dependencies]
anyhow = "1"
cpal = { version = "0.15", optional = true }
whisper-rs = { version = "0.12", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
ureq = "2"
arboard = { version = "3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
dispatch2 = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
rdev = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
